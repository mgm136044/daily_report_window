name: build

# Two jobs on purpose.
#
# `verify` runs on every push and proves the bundle still builds and starts.
# `release` runs only on a tag, and **refuses to publish an unsigned build**.
#
# That refusal is the point. An unsigned executable is not a neutral outcome:
# SmartScreen shows "Windows protected your PC" and most people stop there, so
# shipping one makes installation harder than the `git clone` it replaces.
# Encoding the rule here means nobody has to remember it at 2 a.m.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # The macOS entry is the point of this matrix, not a bonus.
  #
  # Adding Windows meant changing files the macOS path runs through, and that
  # side was checked by reading the code rather than by executing it — the
  # exact standard this project rejects everywhere else. A macOS runner turns
  # "reviewed carefully" into "passes on every push", and it is the only way
  # the claim stays true after the next change.
  #
  # windows-2022 is there for the same reason: it is a generation behind
  # windows-latest, and API differences that only appear on Windows 10 have
  # nowhere else to show up. Linux runs the suite too, to prove the
  # "not supported" path fails loudly rather than half-working.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, macos-latest, ubuntu-latest]
        python: ["3.12"]
        include:
          - os: windows-latest
            python: "3.11"    # the oldest version tomllib exists in
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The tool itself needs nothing but the standard library, which is the
      # whole point of it — pytest is the one thing the *tests* need, and it is
      # installed through `python -m pip` rather than `pip` so it lands in the
      # same interpreter that `python -m pytest` will use. On the macOS runner
      # those are not always the same executable.
      - name: Install the test runner
        run: python -m pip install --upgrade pip pytest

      - name: Run the test suite
        run: python -X utf8 -m pytest tests/ -q

      - name: Linux must refuse to start rather than half-run
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          import platform_support
          try:
              platform_support.require_supported()
          except platform_support.Unsupported as error:
              assert "Linux" in str(error), error
              print("거부됨:", str(error).splitlines()[0])
          else:
              raise SystemExit("Linux 가 지원되는 것처럼 통과했습니다")
          PY

  verify:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check install.ps1 parses under Windows PowerShell
        shell: powershell
        run: |
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "L$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }

      - name: Build
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller daily-report.spec --noconfirm --clean

      # pwsh, not powershell — and this is the same defect the project itself
      # documents, arriving through the workflow file.
      #
      # Actions writes an inline script to a temporary .ps1 with no BOM.
      # Windows PowerShell 5.1 then decodes it in the machine's ANSI codepage,
      # so the Korean below turns to mojibake and the mangled bytes unbalance a
      # quote: the step fails with a ParserError rather than with anything that
      # points at encoding. PowerShell 7 reads script files as UTF-8.
      #
      # The Korean has to stay: the string being matched *is* the frozen
      # build's Korean output, which is exactly what this step exists to check.
      - name: Smoke test the frozen build
        shell: pwsh
        env:
          DAILY_REPORT_HOME: ${{ runner.temp }}\daily-report-data
        run: |
          # doctor exits non-zero on a machine with nothing configured, which
          # is correct — what is being checked is that it runs at all and that
          # its Korean output survives the round trip.
          $output = & dist\daily-report\daily-report.exe doctor 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch '하루 마감 보고서 상태 점검') {
            throw "동결 빌드가 시작되지 않았거나 출력이 깨졌습니다"
          }
          if ($output -notmatch '보고서 프롬프트') {
            throw "번들 안의 자원을 찾지 못했습니다 — paths.resource_root() 확인"
          }
          # doctor's own exit code is 1 here and that is the correct answer:
          # nothing on this runner is configured. Actions ends a pwsh step with
          # `exit $LASTEXITCODE`, so without this the step inherits it and the
          # build fails for the one reason this step is not testing.
          exit 0

      # A clean repository does not mean a clean binary.
      #
      # PyInstaller keeps the absolute path each module was compiled from
      # inside the bytecode, the bootloader records the build directory, and
      # anything the build touched can end up embedded. Built on a personal
      # machine, that is the builder's account name shipped to everyone who
      # downloads it — and the source scan cannot see it, because the source is
      # not where it appears.
      #
      # On a runner the account is "runneradmin", so this is mostly proving the
      # check works; it earns its keep when someone builds a release locally.
      - name: Scan the frozen build for build-machine identifiers
        run: python -X utf8 scripts/check_binary_no_pii.py dist/daily-report

      # Inno Setup is preinstalled on the windows runner images.
      - name: Build the installer
        shell: pwsh
        run: |
          # Preinstalled on the runner images under Program Files (x86);
          # a winget install puts it in the user profile instead.
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) { throw "Inno Setup 을 찾지 못했습니다" }
          & $iscc installer.iss /DSourceDir=dist\daily-report `
                  /DAppVersion=0.1.0 /O"$PWD\dist"
          if ($LASTEXITCODE -ne 0) { throw "설치기 빌드 실패" }
          Get-ChildItem dist\*.exe | ForEach-Object {
            "$($_.Name)  $([math]::Round($_.Length/1MB,1)) MB"
            "SHA256 $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
          }

      - name: Scan the installer too
        run: python -X utf8 scripts/check_binary_no_pii.py dist/daily-report-setup-0.1.0.exe

      - uses: actions/upload-artifact@v4
        with:
          name: daily-report-unsigned
          path: |
            dist/daily-report
            dist/*.exe

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # pwsh for the same reason as the smoke test above: Windows PowerShell
      # 5.1 would decode this file's Korean in the ANSI codepage and fail with
      # a ParserError — meaning the release gate would block for the wrong
      # reason and say nothing about signing.
      # A decision, not a wall.
      #
      # The earlier version refused outright, on the reasoning that SmartScreen
      # blocks unsigned installers. That was too strong: SmartScreen fires on
      # the Mark of the Web, which is applied by browsers and the attachment
      # manager — not by `winget`, not by `git clone`, not by curl. A release
      # distributed through winget largely does not meet it.
      #
      # So shipping unsigned is a legitimate choice. It just has to be an
      # explicit one, which is what the variable below makes it: nobody
      # publishes unsigned by forgetting.
      - name: Confirm the signing decision
        shell: pwsh
        run: |
          $signed = "${{ secrets.SIGNING_ENABLED }}"
          $unsigned = "${{ vars.ALLOW_UNSIGNED_RELEASE }}"
          if ($signed) { "서명된 릴리스로 진행합니다"; exit 0 }
          if ($unsigned -eq 'true') {
            "미서명 릴리스로 진행합니다 (ALLOW_UNSIGNED_RELEASE=true)"
            "  브라우저로 직접 받으면 SmartScreen 경고가 뜹니다."
            "  winget 이나 git clone 경로에서는 뜨지 않습니다."
            exit 0
          }
          throw @"
          서명 여부가 정해지지 않아 릴리스를 중단합니다.

          둘 중 하나를 고르세요.
            - 서명한다      : 저장소 시크릿 SIGNING_ENABLED 를 설정하고 아래 서명 단계를 채운다
            - 서명하지 않는다: 저장소 변수 ALLOW_UNSIGNED_RELEASE 를 true 로 둔다

          미서명이 곧 실패는 아닙니다. SmartScreen 은 Mark of the Web 에 반응하고,
          그건 브라우저와 첨부파일 관리자가 붙입니다 — winget 과 git clone 은 붙이지 않습니다.
          브라우저 다운로드를 주 배포 경로로 삼을 때만 서명이 사실상 필수입니다.
          "@

      # - name: Sign
      #   Fill in once a certificate exists. Azure Trusted Signing:
      #     azure/trusted-signing-action@v0
      #   or signtool with a PFX from a secret.

      - name: Publish the release
        shell: pwsh
        run: |
          Write-Host "여기서 dist\*.exe 를 릴리스 자산으로 올립니다."
          Write-Host "winget 매니페스트의 InstallerUrl 이 이 자산을 가리킵니다."
