name: build

# Two jobs on purpose.
#
# `verify` runs on every push and proves the bundle still builds and starts.
# `release` runs only on a tag, and **refuses to publish an unsigned build**.
#
# That refusal is the point. An unsigned executable is not a neutral outcome:
# SmartScreen shows "Windows protected your PC" and most people stop there, so
# shipping one makes installation harder than the `git clone` it replaces.
# Encoding the rule here means nobody has to remember it at 2 a.m.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only `release` needs to write, and it says so itself.
permissions:
  contents: read

env:
  # Pinned so a new upstream release cannot change what a build produces
  # between one push and the next. **Versions, not hashes** — and the
  # difference is worth stating rather than implying: this stops an unexpected
  # release, not a compromised artifact of the pinned release. Full hash
  # pinning needs a lockfile carrying every transitive wheel for five
  # runner/interpreter combinations, and one written without being able to run
  # it on each of them would break the build rather than secure it.
  #
  # PyInstaller matters most: it is the thing that produces the executable
  # other people install.
  PYTEST_VERSION: "9.0.2"
  PYINSTALLER_VERSION: "6.19.0"

jobs:
  # The macOS entry is the point of this matrix, not a bonus.
  #
  # Adding Windows meant changing files the macOS path runs through, and that
  # side was checked by reading the code rather than by executing it — the
  # exact standard this project rejects everywhere else. A macOS runner turns
  # "reviewed carefully" into "passes on every push", and it is the only way
  # the claim stays true after the next change.
  #
  # windows-2022 is there for the same reason: it is a generation behind
  # windows-latest, and API differences that only appear on Windows 10 have
  # nowhere else to show up. Linux runs the suite too, to prove the
  # "not supported" path fails loudly rather than half-working.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, macos-latest, ubuntu-latest]
        python: ["3.12"]
        include:
          - os: windows-latest
            python: "3.11"    # the oldest version tomllib exists in
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to commit SHAs, not to `@v4`.
      #
      # A major-version tag is a moving pointer the action's owner can
      # repoint. The 2025 `tj-actions/changed-files` compromise worked exactly
      # that way: existing tags were made to point at malicious code, and every
      # workflow tracking them ran it on the next push. These are first-party
      # actions and the risk is small, but what this workflow builds is an
      # unsigned executable that other people install, so the blast radius is
      # not ours to absorb.
      #
      # Comments carry the human-readable version. Dependabot updates both.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}

      # The tool itself needs nothing but the standard library, which is the
      # whole point of it — pytest is the one thing the *tests* need, and it is
      # installed through `python -m pip` rather than `pip` so it lands in the
      # same interpreter that `python -m pytest` will use. On the macOS runner
      # those are not always the same executable.
      - name: Install the test runner
        run: python -m pip install --upgrade pip "pytest==${{ env.PYTEST_VERSION }}"

      - name: Run the test suite
        run: python -X utf8 -m pytest tests/ -q

      - name: Linux must refuse to start rather than half-run
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          import platform_support
          try:
              platform_support.require_supported()
          except platform_support.Unsupported as error:
              assert "Linux" in str(error), error
              print("거부됨:", str(error).splitlines()[0])
          else:
              raise SystemExit("Linux 가 지원되는 것처럼 통과했습니다")
          PY

  verify:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # One version for the installer filename, the Inno metadata and the
      # release, taken from the tag when there is one. A build that is not a
      # release is marked as such rather than borrowing a version number it
      # does not have.
      # Through `env:`, not interpolated into the script.
      #
      # `${{ }}` is substituted as text before PowerShell parses anything, so
      # a value containing a quote becomes code. Git allows `"` and `$` in a
      # tag name — `git check-ref-format` accepts `refs/tags/v1.0";calc;"` —
      # and pushing a tag is what starts a release. Self-inflicted, since it
      # takes push access, and still the documented injection shape.
      - name: Work out the version
        id: version
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          $ref = $env:REF
          if ($ref -like 'refs/tags/v*') {
            $version = $ref -replace '^refs/tags/v', ''
          } else {
            $version = "0.0.0-dev"
          }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "버전: $version"

      # This file's own PowerShell, parsed before anything depends on it. The
      # release job runs only on a tag, so a mistake in it can sit unnoticed
      # until the moment it matters most.
      - name: Check this workflow's PowerShell parses
        run: python -X utf8 scripts/check_workflow_powershell.py .github/workflows/build.yml

      - name: Check install.ps1 parses under Windows PowerShell
        shell: powershell
        run: |
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "L$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }

      - name: Build
        run: |
          python -m pip install --upgrade pip "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
          python -m PyInstaller daily-report.spec --noconfirm --clean

      # pwsh, not powershell — and this is the same defect the project itself
      # documents, arriving through the workflow file.
      #
      # Actions writes an inline script to a temporary .ps1 with no BOM.
      # Windows PowerShell 5.1 then decodes it in the machine's ANSI codepage,
      # so the Korean below turns to mojibake and the mangled bytes unbalance a
      # quote: the step fails with a ParserError rather than with anything that
      # points at encoding. PowerShell 7 reads script files as UTF-8.
      #
      # The Korean has to stay: the string being matched *is* the frozen
      # build's Korean output, which is exactly what this step exists to check.
      - name: Smoke test the frozen build
        shell: pwsh
        env:
          DAILY_REPORT_HOME: ${{ runner.temp }}\daily-report-data
        run: |
          # doctor exits non-zero on a machine with nothing configured, which
          # is correct — what is being checked is that it runs at all and that
          # its Korean output survives the round trip.
          $output = & dist\daily-report\daily-report.exe doctor 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch '하루 마감 보고서 상태 점검') {
            throw "동결 빌드가 시작되지 않았거나 출력이 깨졌습니다"
          }
          if ($output -notmatch '보고서 프롬프트') {
            throw "번들 안의 자원을 찾지 못했습니다 — paths.resource_root() 확인"
          }
          # doctor's own exit code is 1 here and that is the correct answer:
          # nothing on this runner is configured. Actions ends a pwsh step with
          # `exit $LASTEXITCODE`, so without this the step inherits it and the
          # build fails for the one reason this step is not testing.
          exit 0

      # A clean repository does not mean a clean binary.
      #
      # PyInstaller keeps the absolute path each module was compiled from
      # inside the bytecode, the bootloader records the build directory, and
      # anything the build touched can end up embedded. Built on a personal
      # machine, that is the builder's account name shipped to everyone who
      # downloads it — and the source scan cannot see it, because the source is
      # not where it appears.
      #
      # On a runner the account is "runneradmin", so this is mostly proving the
      # check works; it earns its keep when someone builds a release locally.
      - name: Scan the frozen build for build-machine identifiers
        run: python -X utf8 scripts/check_binary_no_pii.py dist/daily-report

      # A second scan, of the bundle's *text*, against the ordinary patterns.
      #
      # The one above only knows the identifiers of the machine it runs on —
      # account name, home directory, hostname. That is the wrong question for
      # a file copied in by mistake: a development note naming a client leaks
      # nothing about the builder and everything about the work.
      #
      # `("docs", "docs")` in the spec collected a whole *directory*, which
      # holds four files in the public checkout CI builds from and twenty-eight
      # in the private tree a release could equally be built from. Nothing
      # checked. This is the check.
      #
      # Scoped to the directories this project puts in the bundle. Scanning all
      # of `_internal` also reads Tcl/Tk's own sources, which tkinter brings
      # along and which carry upstream authors' email addresses in comments —
      # measured, twenty findings, none of them ours. A check that fails for
      # somebody else's file is one people learn to force past.
      - name: Scan the files this project put in the bundle
        shell: pwsh
        run: |
          $bad = $false
          foreach ($name in @("docs", "prompts", "templates", "skills")) {
            $path = "dist\daily-report\_internal\$name"
            if (-not (Test-Path $path)) { throw "번들에 $name 이 없습니다" }
            python -X utf8 scripts/check_no_pii.py $path --no-history
            if ($LASTEXITCODE -ne 0) { $bad = $true }
          }
          if ($bad) { throw "번들에 실린 이 프로젝트의 파일에서 개인정보가 발견됐습니다" }

      # Inno Setup is preinstalled on the windows runner images.
      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Preinstalled on the runner images under Program Files (x86);
          # a winget install puts it in the user profile instead.
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) { throw "Inno Setup 을 찾지 못했습니다" }
          $version = $env:VERSION
          & $iscc installer.iss /DSourceDir=dist\daily-report `
                  /DAppVersion=$version /O"$PWD\dist"
          if ($LASTEXITCODE -ne 0) { throw "설치기 빌드 실패" }
          # The hash is written beside the installer: it is what makes an
          # unsigned download verifiable, and what winget checks before it
          # will install anything.
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$($_.Name)  $([math]::Round($_.Length/1MB,1)) MB"
            "SHA256 $hash"
            "$hash  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii
          }

      # Deliberately NOT a scan of the compiled installer.
      #
      # That step existed and was incapable of failing: the Inno payload is a
      # solid LZMA2 stream, so a raw byte search finds nothing regardless of
      # contents. Measured — the same marker is found in `dist/`, found with
      # `Compression=none`, and invisible with the shipped `lzma2`. A check
      # that cannot fail reads as assurance and is worse than none.
      #
      # Everything the installer ships comes from `dist/daily-report`, which is
      # scanned above, before compression. Anything added to [Files] from
      # outside that directory would not be covered by either — so this asserts
      # there is nothing of the sort.
      - name: Confirm the installer ships only what was scanned
        shell: pwsh
        run: |
          $iss = Get-Content installer.iss -Raw -Encoding UTF8
          $sources = [regex]::Matches($iss, '(?m)^\s*Source:\s*"([^"]+)"')
          foreach ($match in $sources) {
            $value = $match.Groups[1].Value
            if ($value -notlike '{#SourceDir}*') {
              throw "스캔되지 않은 경로가 설치기에 포함됩니다: $value"
            }
          }
          "설치기 [Files] 항목 $($sources.Count)개 — 전부 스캔된 SourceDir 에서 옵니다"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: daily-report-unsigned
          path: |
            dist/daily-report
            dist/*.exe
            dist/*.sha256

      # Separately, because the release job wants only these two and not the
      # 24 MB of unpacked bundle beside them.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: installer
          path: |
            dist/*.exe
            dist/*.sha256

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # pwsh for the same reason as the smoke test above: Windows PowerShell
      # 5.1 would decode this file's Korean in the ANSI codepage and fail with
      # a ParserError — meaning the release gate would block for the wrong
      # reason and say nothing about signing.
      # A decision, not a wall.
      #
      # The earlier version refused outright, on the reasoning that SmartScreen
      # blocks unsigned installers. That was too strong: SmartScreen fires on
      # the Mark of the Web, which is applied by browsers and the attachment
      # manager — not by `winget`, not by `git clone`, not by curl. A release
      # distributed through winget largely does not meet it.
      #
      # So shipping unsigned is a legitimate choice. It just has to be an
      # explicit one, which is what the variable below makes it: nobody
      # publishes unsigned by forgetting.
      - name: Confirm the signing decision
        shell: pwsh
        env:
          SIGNED: ${{ secrets.SIGNING_ENABLED }}
          UNSIGNED: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          $signed = $env:SIGNED
          $unsigned = $env:UNSIGNED
          if ($signed) { "서명된 릴리스로 진행합니다"; exit 0 }
          if ($unsigned -eq 'true') {
            "미서명 릴리스로 진행합니다 (ALLOW_UNSIGNED_RELEASE=true)"
            "  브라우저로 직접 받으면 SmartScreen 경고가 뜹니다."
            "  winget 이나 git clone 경로에서는 뜨지 않습니다."
            exit 0
          }
          # An array rather than a here-string. Both work — a YAML block scalar
          # strips the common indentation, so a `"@` written at this level does
          # end up at column 0 where PowerShell needs it — but the array keeps
          # the message readable at the indentation it is written in, and does
          # not depend on that stripping being understood by whoever edits it.
          $message = @(
            "서명 여부가 정해지지 않아 릴리스를 중단합니다."
            ""
            "둘 중 하나를 고르세요."
            "  - 서명한다      : 저장소 시크릿 SIGNING_ENABLED 를 설정하고 아래 서명 단계를 채운다"
            "  - 서명하지 않는다: 저장소 변수 ALLOW_UNSIGNED_RELEASE 를 true 로 둔다"
            ""
            "미서명이 곧 실패는 아닙니다. SmartScreen 은 Mark of the Web 에 반응하고,"
            "그건 브라우저와 첨부파일 관리자가 붙입니다 — winget 과 git clone 은 붙이지 않습니다."
            "브라우저 다운로드를 주 배포 경로로 삼을 때만 서명이 사실상 필수입니다."
          ) -join "`n"
          throw $message

      # Built once, in `verify`, and taken from there. Rebuilding here would
      # produce a different binary from the one that passed the smoke test and
      # the identifier scan — and the hash published below has to be the hash
      # of the file that was actually checked.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: installer
          path: dist

      # - name: Sign
      #   Fill in once a certificate exists. Azure Trusted Signing:
      #     azure/trusted-signing-action@v0
      #   or signtool with a PFX from a secret.

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          SIGNED: ${{ secrets.SIGNING_ENABLED }}
          REPO: ${{ github.repository }}
        run: |
          $version = $env:VERSION
          $installer = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $installer) { throw "설치기를 찾지 못했습니다" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          $signed = if ($env:SIGNED) { "서명됨" } else { "**서명되지 않음**" }

          # An array, and the two backtick variables, because this text is
          # markdown: it needs literal backticks for code fences and inline
          # code, and a backtick is PowerShell's escape character. Building
          # them from a char code is plainer than a wall of doubled backticks,
          # which is what the here-string form of this required.
          $fence = [string][char]0x60 * 3
          $tick = [string][char]0x60
          $notes = @(
            "## 설치"
            ""
            $fence
            "winget install mgm136044.daily-report"
            $fence
            ""
            "또는 저장소를 클론해서 ${tick}install.ps1${tick} 을 실행해도 됩니다."
            "그쪽이 이 프로젝트에서 가장 오래 검증된 경로입니다."
            ""
            "## 이 파일"
            ""
            "| | |"
            "|---|---|"
            "| 파일 | ${tick}$($installer.Name)${tick} |"
            "| 크기 | $([math]::Round($installer.Length/1MB,1)) MB |"
            "| SHA256 | ${tick}$hash${tick} |"
            "| 서명 | $signed |"
            ""
            "서명이 없으므로 **브라우저로 직접 받아 실행하면 SmartScreen 경고가 뜹니다.**"
            "그 경고는 Mark of the Web 에 반응하는 것이라 ${tick}winget${tick} 이나"
            "${tick}git clone${tick} 경로에서는 나타나지 않습니다."
            "브라우저로 받으셨다면 위 SHA256 을 대조하세요:"
            ""
            $fence
            "(Get-FileHash $($installer.Name) -Algorithm SHA256).Hash"
            $fence
            ""
            "## 준비물"
            ""
            "Windows 10/11, git, 그리고 **로그인된 Claude Code CLI**."
            "요약을 ${tick}claude -p${tick} 가 만들기 때문에 CLI 없이는 수집만 되고"
            "보고서가 나오지 않습니다. Notion 내부 연결 토큰도 필요합니다 —"
            "설치 마법사가 안내합니다."
          ) -join "`n"

          $notes | Out-File release-notes.md -Encoding utf8

          # --repo, because this job deliberately does not check the source out
          # — it only needs the artifact `verify` already built. Without it gh
          # looks for a git remote, finds no repository, and fails with
          # "fatal: not a git repository".
          gh release create "v$version" `
            "$($installer.FullName)" "$($installer.FullName).sha256" `
            --repo $env:REPO `
            --title "v$version" --notes-file release-notes.md

          # gh's exit code is the only signal here. Without this the step
          # printed "릴리스 생성됨" over a failure and returned 1 anyway — a
          # message that says the opposite of what happened is worse than none.
          if ($LASTEXITCODE -ne 0) { throw "릴리스 생성 실패 (gh exit $LASTEXITCODE)" }
          Write-Host "릴리스 v$version 생성됨"
