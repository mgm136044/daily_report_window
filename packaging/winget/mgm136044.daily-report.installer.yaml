# Installer manifest.
#
# The hash is what makes this route trustworthy without a code-signing
# certificate: winget refuses to install a file that does not match it, so a
# tampered download fails rather than runs.
#
# Both values are from the v0.1.0 release, checked by downloading it back and
# recomputing:
#
#   BB96ACA3E124B55F5AA85E8A3DA6229694E0F833B7C73EAF0443FB0EE98FAA14
#
# Every new version needs a new copy of these three files with the version,
# URL and hash updated. There is no way to point winget at "latest".

PackageIdentifier: mgm136044.daily-report
PackageVersion: 0.2.1
InstallerType: inno
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
InstallerSwitches:
  Silent: /VERYSILENT /NORESTART
  SilentWithProgress: /SILENT /NORESTART
  # The uninstaller runs `daily-report.exe uninstall` first, which removes the
  # scheduled task. Without that the task survives the program and fails to
  # start every night, forever.
  Custom: /NORESTART
UpgradeBehavior: install
ReleaseDate: 2026-08-09
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/mgm136044/daily_report_window/releases/download/v0.2.1/daily-report-setup-0.2.1.exe
    InstallerSha256: 3C904E15B493C3A0E090B9A22A79A04334E0C495D8FE278536B3122BD0403891
ManifestType: installer
ManifestVersion: 1.6.0
