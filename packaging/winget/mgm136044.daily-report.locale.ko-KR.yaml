ShortDescription: 코딩 에이전트의 세션 기록에서 하루치 업무 보고서를 만들어 Notion 에 적재합니다.
Description: |-
  Claude Code 와 Codex CLI 가 이미 남기고 있는 세션 기록, git 커밋, 디스크 변경에서
  그날 실제로 한 일을 뽑아 요약하고, Notion 데이터베이스에 날짜별 한 행으로 넣습니다.

  새로 추적하는 것은 없습니다. 다시 볼 일 없는 99.9% 를 버리고 남은 것으로 보고서를
  만듭니다. 매일 04:05 에 예약 작업이 알아서 돌고, 기기가 꺼져 있던 날은 다음 실행에서
  채웁니다.

  요약은 로그인된 Claude Code CLI 또는 Codex CLI 가 만듭니다. 그래서 살균을 거친
  수집 결과가 해당 제공자의 API 로 전송됩니다. Notion 에 게시되는 것은 모델이 쓴
  산문뿐이며 원본 프롬프트와 명령은 올라가지 않습니다. 자격증명 마스킹이 두 번 —
  모델이 보기 전과 게시하기 전에 — 돌아갑니다. 대외비 폴더는 `exclude.paths` 로
  수집 자체를 막을 수 있습니다.

  Notion 내부 연결 토큰과, 로그인된 Claude Code CLI 또는 Codex CLI 가 필요합니다.
